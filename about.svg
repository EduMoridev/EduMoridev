<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" role="img" aria-label="Sou co-founder e desenvolvedor front-end da Kronos, uma startup que está criando um software para unificar plataformas de agendamento. Trabalho principalmente com Next.js e TypeScript e, quando o projeto precisa, também desenvolvo no back-end com Java e Spring Boot. Fora da Kronos, faço landing pages e sites institucionais como freelancer, cuidando do layout até o deploy na Vercel. Estou cursando Engenharia de Software."><defs>
