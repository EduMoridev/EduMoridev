name: Build profile assets

# Gera a cobrinha E o profile scan no mesmo job e publica tudo na branch "output".
# Precisa ser um workflow só: dois workflows publicando na mesma branch se sobrescrevem.

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Precisa rodar ANTES da cobrinha: o Snake roda em Docker como root e,
      # se criar a pasta dist/ primeiro, o Python não tem permissão de escrever nela.
      - name: Profile scan
        run: |
          pip install pillow
          python scripts/profile_scan.py --out dist/profile-scan.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
