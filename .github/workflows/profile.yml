name: Build profile assets

# Gera todos os painéis SVG do README e publica na branch "output".

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC (atualiza avatar, repos e contribuições)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar painéis
        run: |
          pip install pillow
          python scripts/profile_scan.py --outdir dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
